name: CI

on:
  push:
    branches:
      - main
      - feature/termux-adb-lite
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  mobile-ui-plugin:
    name: Mobile UI plugin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: openclaw-plugin-mobile-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openclaw-plugin-mobile-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Termux runtime plugin
        run: npm run build

      - name: Test canonical context event surfaces
        run: python3 ../installer/termux-lite/test-context-surfaces.py
      - name: Test canonical app and authenticated Bixby bootstrap
        run: node scripts/test-canonical-agent-bootstrap.cjs

      - name: Run trace induction tests
        run: npm run test:trace-induction

      - name: Run Control health components contract
        run: node scripts/test-control-health-components.cjs

      - name: Run 38 M1 comprehension health field (real S24 runs capture)
        run: node scripts/test-control-comprehension.cjs

      - name: Run history deletion contract
        run: node scripts/test-delete-run.cjs

      - name: Run edit-and-replay contract (édition d'un message envoyé, audit sans suppression)
        run: node scripts/test-edit-replay.cjs

      - name: Run 38 A2 learning owner routes (guards, budget, not-this run marker)
        run: node scripts/test-learning-routes.cjs

      - name: Run claw-live Control and owner view projections
        run: python3 ../installer/termux-lite/test-claw-live-control.py

      - name: Run Claw relay reconnect contract
        run: |
          node scripts/test-voice-relay.cjs
          node scripts/test-voice-relay-reconnect.cjs

      - name: Lot 41 piste 2 — la voix dit ce qu'elle a compris (V1, V2, V3) sur fixtures S24
        run: node scripts/test-voice-understanding.cjs
      - name: HS3 closed presentation and existing run transport
        run: |
          python3 scripts/test-receipt-presentation-read.py
          node scripts/test-receipt-presentation.cjs

      - name: HS6 shared receipt privacy (OTP/PIN)
        run: node scripts/test-voice-receipt-metadata.cjs
      - name: HS5 run progress steps from existing receipts
        run: node scripts/test-run-progress.cjs

      - name: HS3 payment handoff run reflects its payment request (S24 capture core 176)
        run: node scripts/test-run-payment-presentation.cjs

      - name: Run composed read and model fast path contracts
        run: |
          python3 scripts/test-composed-read-result.py
          node scripts/test-model-fast-path.cjs

      - name: Qualify Companion M1 contracts and telemetry offline
        run: |
          node scripts/test-voice-m1-telemetry.cjs
          node scripts/test-voice-m1-contracts.cjs
          node scripts/test-voice-m1-disturbances.cjs
          node scripts/test-claw-live-warm-detach.cjs
          python3 scripts/test-voice-m1-corpus.py
          node scripts/test-voice-turn-protocol.cjs
          node scripts/test-warm-v2-ownership.cjs
          node scripts/test-claw-live-warm.cjs
          node scripts/test-claw-live-warm-cancellation.cjs
          TMPDIR=/tmp node scripts/test-claw-live.cjs
          node scripts/test-companion-runs.cjs

      - name: Test attachment storage
        run: node scripts/test-attachment-storage.cjs

      - name: Test attachment HTTP contract
        run: node scripts/test-attachment-http.cjs
      - name: Run inactivity evidence and lifecycle regression contracts
        run: |
          node scripts/test-run-inactivity.cjs
          node scripts/test-conversation-backfill-races.cjs
          node scripts/test-companion-history-cache.cjs
          node scripts/test-conversation-pages.cjs
          node scripts/test-submit-reconciliation.cjs
          node scripts/test-payment-core.cjs
      - name: Maxit top-up payment path (blocked proof, precise reasons, step receipts, nested budgets) — lot 11/10
        run: |
          node scripts/test-maxit-topup-payment-adapter.cjs
          node scripts/test-payment-budgets.cjs
          node scripts/test-payment-steps.cjs
          node scripts/test-payment-api.cjs
          node scripts/test-payment-handoff.cjs
          node scripts/test-maxit-quote-real-shape.cjs
      - name: Network mutation guard (Auto Wi-Fi lease, Wi-Fi watch, exact restore) — lot 11/10
        run: python3 ../installer/termux-lite/test-android-network-mutation-guard.py
      - name: Run request cancellation owner contract
        run: node scripts/test-control-request-cancel.cjs
      - name: Run Control pinned runtime snapshot regression
        run: node scripts/test-control-runtime-snapshot.cjs
      - name: Run automation detail and owner actions contract
        run: node scripts/test-automation-detail.cjs
      - name: Test laptop owner pairing and biometric scope
        run: node scripts/test-laptop-access.cjs
      - name: Run read-only notification source contract
        run: node scripts/test-notification-sources.cjs

      - name: Run read-only diagnostic export contract
        run: node scripts/test-diagnostic.cjs

      - name: Run agent configuration owner contract
        run: node scripts/test-agent-config.cjs

      - name: Preserve specialized rules in bounded voice bootstrap
        run: node scripts/test-voice-operating-rules.cjs

      - name: Run conversation metadata owner contract
        run: |
          node scripts/test-conversation-metadata.cjs
          node scripts/test-conversation-thinking.cjs
          node scripts/test-conversation-thinking-fixtures.cjs
          node scripts/test-conversation-context.cjs
          node scripts/test-conversation-context-race.cjs
          node scripts/test-conversation-context-coverage.cjs
          node scripts/test-conversation-owner-cache.cjs
          node scripts/test-model-owner.cjs
          python3 scripts/test-conversation-acceptance.py

      - name: Canonical request conversation origin contracts
        run: |
          node scripts/test-conversation-origin.cjs
          python3 ../installer/termux-lite/test-context-session-origin.py

      - name: Run WhatsApp allowlist owner and HTTP contracts
        run: |
          python3 ../installer/termux-lite/test-people-trusted.py
          python3 ../installer/termux-lite/test-whatsapp-allowlist.py
          python3 ../installer/termux-lite/test-whatsapp-allowlist-manager.py
          python3 ../installer/termux-lite/test-whatsapp-allowlist-acceptance.py
          node scripts/test-whatsapp-allowlist.cjs
          node scripts/test-whatsapp-allowlist-paired.cjs

      - name: Run skill detail and owner controls contract
        run: node scripts/test-skill-control.cjs

      - name: Run reviewed approval confirmation contract
        run: node scripts/test-agent-approvals.cjs

      - name: Run reviewed voice choice and rewarm contract
        run: node scripts/test-voice-choices.cjs

      - name: Run reviewed runtime contract report
        run: python3 scripts/test-runtime-contract-report.py

      - name: Skill learning draft contracts
        run: |
          node scripts/test-skill-learning.cjs
          node scripts/test-skill-learning-guard.cjs
          python3 ../installer/termux-lite/test-skill-learning-acceptance.py

      - name: Run file read boundary preparation fixtures
        run: |
          node scripts/test-file-read-boundary.cjs
          node scripts/test-file-gateway-read.cjs
          node scripts/test-files-http.cjs
          node scripts/test-file-gateway-limits.cjs
          node scripts/test-strict-process-cleanup.cjs
          python3 scripts/test-files-acceptance.py

      - name: Run usage and shared provider read contracts
        run: node scripts/test-usage-providers.cjs

      - name: Run /usage and /runs?limit=50 latency budgets with S24 latencies (p95 <= 50 % of acceptance budget)
        run: node scripts/test-usage-runs-latency.cjs

      - name: Run UI recette server fixes on S24 captures (account privacy, cost, composer, history, previews)
        run: |
          node scripts/test-ui-recette-server.cjs
          python3 scripts/test-acceptance-email-leak.py

      - name: Run UI recette 2 server fixes on S24 captures (agent thinking defaults, providers after a failed refresh, usage kept)
        run: node scripts/test-recette2-server.cjs

      - name: Run memory control and atomic export import contracts
        run: |
          node scripts/test-memory-control.cjs
          python3 ../installer/termux-lite/test-context-import.py
      - name: Run read-only security surfaces contract
        run: node scripts/test-security-surfaces.cjs

      - name: Run bounded cross-surface native digest contract
        run: |
          python3 ../installer/termux-lite/test-context-digest.py
          python3 ../installer/termux-lite/test-context-native-fixtures.py
          python3 ../installer/termux-lite/test-context-scale.py
          python3 ../installer/termux-lite/test-context-import.py
      - name: Test health manager resource restart policy
        run: |
          python3 ../installer/termux-lite/test-health-resource-policy.py
          python3 ../installer/termux-lite/test-gateway-memory-guard.py
          python3 ../installer/termux-lite/test-owner-retention.py
          node scripts/test-remote-bridge-retention.cjs
      - name: MCP context scopes and admitted client provenance
        run: |
          node scripts/test-mcp-context-provenance.cjs
          npm ci --prefix ../cloud/voice-relay --ignore-scripts --omit=dev
          node ../cloud/voice-relay/test-mcp.mjs
          node ../cloud/voice-relay/test-long-action.mjs

      - name: Verify host-bound capability owner admission (P1)
        run: |
          node scripts/test-capability-tool.cjs
          node scripts/test-capability-admission.cjs

      - name: E3 agent cannot run operator or transaction capabilities outside the harness
        run: |
          node scripts/test-agent-capability-guard.cjs
          python3 ../installer/termux-lite/test-claw-capability-agent-policy.py
      - name: E3 CLARIFY and resolve-clarification on WhatsApp, voice relay and Gemini Live (T5)
        run: node scripts/test-e3-surfaces.cjs
      - name: PR template section regression tests
        run: python3 -m unittest discover -s ../tests -p test_pr_template.py
      - name: PR description follows repository template
        run: python3 ../tools/check_pr_template.py
      - name: Run exact read projection ETags and existing owner budgets
        run: node scripts/test-read-etags.cjs
      - name: G5 deployed receipt date and HTTP budget
        run: node scripts/test-update-deployment-date.cjs

      - name: J1 bounded read-only secret scan and H8 integration
        run: |
          python3 ../installer/termux-lite/test-workspace-secret-scan.py
          python3 ../installer/termux-lite/test-card-detector.py
          python3 ../installer/termux-lite/test-secret-scan-root-partition.py
          python3 ../installer/termux-lite/test-nightly-secret-scan.py
      - name: H8 nightly read-only acceptance, deployment lock and drift receipts
        run: |
          node scripts/test-nightly-health-http.cjs
          python3 ../installer/termux-lite/test-companion-nightly-acceptance.py
          python3 ../installer/termux-lite/test-health-verdict.py
          python3 ../installer/termux-lite/test-health-verdict-f5.py
      - name: F6 Remote Bridge stuck receipts become bounded abandoned without replay
        run: node scripts/test-remote-bridge-abandoned.cjs
      - name: F4 structured notifications on the captured runs summary
        run: node scripts/test-notification-structured.cjs
      - name: Run derived catalogue fail-closed projection and real HTTP cache contract
        run: node scripts/test-catalog.cjs
      - name: Catalogue exampleFr recopié de HS1 (phrase française à dire, sources S24)
        run: node scripts/test-catalog-example-fr.cjs
      - name: Catalogue bills status from bridge receipts and confirmed payments (50 000 receipts, warm 300 ms)
        run: node scripts/test-catalog-bill-status.cjs
      - name: G4 deployment receipts and route budget
        run: node scripts/test-deployment-receipts.cjs
      - name: C5 canonical voice owner transport fixture
        run: python3 ../installer/termux-lite/test-context-voice-read.py
      - name: H9 read-only UI smoke synthetic safety boundaries
        run: python3 ../installer/termux-lite/test-ui-smoke.py

      - name: O8 baseline model efficiency and Gemini client regression
        run: |
          python3 ../installer/termux-lite/test-model-efficiency.py
          python3 ../installer/termux-lite/test-gemini-request.py

      - name: Verify telecom display and bounded execution provenance (O7)
        run: |
          python3 ../installer/termux-lite/test-telecom-display.py
          node scripts/test-capability-provenance.cjs

      - name: O9 voice runs terminal state on the captured S24 runs and acceptance line
        run: |
          node scripts/test-voice-run-terminal-state.cjs
          python3 ../installer/termux-lite/test-companion-acceptance-voice.py

      - name: O6 fast path waits for the guarded operator entry (60 s bound)
        run: |
          python3 ../installer/termux-lite/test-guarded-operator-wait.py
          node scripts/test-guarded-entry-wait.cjs

      - name: O10 voice admits the low-risk owner decision record, never payment or confirmed paths
        run: node scripts/test-voice-low-risk-admission.cjs

      - name: R1 model usage roles from canonical config owner
        run: node scripts/test-model-roles.cjs

      - name: F7 Gateway append log retention
        run: python3 ../installer/termux-lite/test-gateway-log-retention.py

      - name: E3 agent file write (biometric, CAS, privacy lines kept, free vocabulary, five backups)
        run: node scripts/test-agent-file-write-plan.cjs

      - name: R23 automation edit (validation, real cron captures, CAS, confirmation, receipts)
        working-directory: openclaw-plugin-mobile-ui
        run: |
          node scripts/test-automation-edit-validation.cjs
          node scripts/test-automation-edit-http.cjs

      - name: H6 canonical resolved intention and free vocabulary boundary
        run: node scripts/test-payment-pattern-boundary.cjs
