          node scripts/test-conversation-thinking-fixtures.cjs
          node scripts/test-conversation-context.cjs
          node scripts/test-conversation-context-race.cjs
          node scripts/test-conversation-context-coverage.cjs
          node scripts/test-conversation-owner-cache.cjs
          node scripts/test-model-owner.cjs
