name: CI

on:
  push:
    branches:
      - main
      - feature/termux-adb-lite
  pull_request:

jobs:
  mobile-ui-plugin:
    name: Mobile UI plugin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: openclaw-plugin-mobile-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openclaw-plugin-mobile-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Termux runtime plugin
        run: npm run build

      - name: Run trace induction tests
        run: npm run test:trace-induction

      - name: Run Control health components contract
        run: node scripts/test-control-health-components.cjs

      - name: Run history deletion contract
        run: node scripts/test-delete-run.cjs

      - name: Run claw-live Control and owner view projections
        run: python3 ../installer/termux-lite/test-claw-live-control.py

      - name: Run Claw relay reconnect contract
        run: |
          node scripts/test-voice-relay.cjs
          node scripts/test-voice-relay-reconnect.cjs

      - name: Run composed read and model fast path contracts
        run: |
          python3 scripts/test-composed-read-result.py
          node scripts/test-model-fast-path.cjs

      - name: Qualify Companion M1 contracts and telemetry offline
        run: |
          node scripts/test-voice-m1-telemetry.cjs
          node scripts/test-voice-m1-contracts.cjs
          node scripts/test-voice-m1-disturbances.cjs
          node scripts/test-claw-live-warm-detach.cjs
          python3 scripts/test-voice-m1-corpus.py
          node scripts/test-voice-turn-protocol.cjs
          node scripts/test-warm-v2-ownership.cjs
          node scripts/test-claw-live-warm.cjs
          node scripts/test-claw-live-warm-cancellation.cjs
          TMPDIR=/tmp node scripts/test-claw-live.cjs
          node scripts/test-companion-runs.cjs

      - name: Test attachment storage
        run: node scripts/test-attachment-storage.cjs

      - name: Test attachment HTTP contract
        run: node scripts/test-attachment-http.cjs
      - name: Run inactivity evidence and lifecycle regression contracts
        run: |
          node scripts/test-run-inactivity.cjs
          node scripts/test-conversation-backfill-races.cjs
          node scripts/test-companion-history-cache.cjs
          node scripts/test-conversation-pages.cjs
          node scripts/test-submit-reconciliation.cjs
          node scripts/test-payment-core.cjs
      - name: Run request cancellation owner contract
        run: node scripts/test-control-request-cancel.cjs
      - name: Run Control pinned runtime snapshot regression
        run: node scripts/test-control-runtime-snapshot.cjs
      - name: Run automation detail and owner actions contract
        run: node scripts/test-automation-detail.cjs
      - name: Test laptop owner pairing and biometric scope
        run: node scripts/test-laptop-access.cjs
      - name: Run read-only notification source contract
        run: node scripts/test-notification-sources.cjs

      - name: Run read-only diagnostic export contract
        run: node scripts/test-diagnostic.cjs

      - name: Run agent configuration owner contract
        run: node scripts/test-agent-config.cjs

      - name: Run conversation metadata owner contract
        run: |
          node scripts/test-conversation-metadata.cjs
          node scripts/test-conversation-owner-cache.cjs
          node scripts/test-model-owner.cjs
          python3 scripts/test-conversation-acceptance.py

      - name: Canonical request conversation origin contracts
        run: |
          node scripts/test-conversation-origin.cjs
          python3 ../installer/termux-lite/test-context-session-origin.py

      - name: Run WhatsApp allowlist owner and HTTP contracts
        run: |
          python3 ../installer/termux-lite/test-people-trusted.py
          python3 ../installer/termux-lite/test-whatsapp-allowlist.py
          python3 ../installer/termux-lite/test-whatsapp-allowlist-manager.py
          python3 ../installer/termux-lite/test-whatsapp-allowlist-acceptance.py
          node scripts/test-whatsapp-allowlist.cjs
          node scripts/test-whatsapp-allowlist-paired.cjs

      - name: Run skill detail and owner controls contract
        run: node scripts/test-skill-control.cjs

      - name: Run reviewed approval confirmation contract
        run: node scripts/test-agent-approvals.cjs

      - name: Run reviewed voice choice and rewarm contract
        run: node scripts/test-voice-choices.cjs

      - name: Run reviewed runtime contract report
        run: python3 scripts/test-runtime-contract-report.py

      - name: Skill learning draft contracts
        run: |
          node scripts/test-skill-learning.cjs
          node scripts/test-skill-learning-guard.cjs
          python3 ../installer/termux-lite/test-skill-learning-acceptance.py

      - name: Run memory control and atomic export import contracts
        run: |
          node scripts/test-memory-control.cjs
          python3 ../installer/termux-lite/test-context-import.py
      - name: Run read-only security surfaces contract
        run: node scripts/test-security-surfaces.cjs
