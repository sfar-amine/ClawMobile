          node scripts/test-payment-budgets.cjs
          node scripts/test-payment-steps.cjs
          node scripts/test-payment-api.cjs
          node scripts/test-payment-handoff.cjs
          node scripts/test-maxit-quote-real-shape.cjs
      - name: Network mutation guard (Auto Wi-Fi lease, Wi-Fi watch, exact restore) — lot 11/10
        run: python3 ../installer/termux-lite/test-android-network-mutation-guard.py
      - name: Orange cellular Unix forward (private pathname, exact observation and cleanup)
        run: python3 ../installer/termux-lite/test-android-network-mutation-guard.py LocalFilesystemForwardTests -v
      - name: Wi-Fi-off guard self-healing (detached restorer, bounded TTL, sweep, cellular default untouched) — incident 11/10 16:00
        run: |
          python3 ../installer/termux-lite/test-android-network-mutation-guard.py WifiRestorerTests DetachedRestorerProcessTest HealthManagerSweepContractTest CellularDefaultTests -v
          python3 ../installer/termux-lite/test-health-verdict.py
