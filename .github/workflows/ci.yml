      - name: Run read-only diagnostic export contract
        run: node scripts/test-diagnostic.cjs

      - name: Test automation SQLite revision latency and cache
        run: node scripts/test-control-automations-latency.cjs

      - name: Run agent configuration owner contract
        run: node scripts/test-agent-config.cjs
      - name: Agent config concurrent owner reads
        working-directory: openclaw-plugin-mobile-ui
        run: node scripts/test-agent-config-flight.cjs

      - name: Refresh curated private context before background save
        run: python3 ../scripts/test-context-background-sync.py

      - name: H5 existing R6 R7 R12 acceptance evidence
        run: python3 scripts/test-h5-acceptance-evidence.py
      - name: Preserve specialized rules in bounded voice bootstrap
        run: node scripts/test-voice-operating-rules.cjs

