name: CI

on:
  push:
    branches:
      - runtime/samantha-companion-private
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-ui-plugin:
    name: Mobile UI plugin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: openclaw-plugin-mobile-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openclaw-plugin-mobile-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Termux runtime plugin
        run: npm run build

      - name: WhatsApp survives extended network outages without retry storms
        run: |
          python3 ../installer/termux-lite/test-whatsapp-network-recovery.py
          node ../installer/termux-lite/test-whatsapp-network-recovery.cjs

      - name: WhatsApp rooms snapshot is git-tracked only and its agent read-only
        run: python3 ../installer/termux-lite/test-project-room.py
      - name: Pulse room agents (fichier 52 §5)
        run: python3 ../installer/termux-lite/test-pulse-room.py
      - name: Fast path shows any deterministic result as readable text (Amine 12/10)
        run: python3 ../installer/termux-lite/test-model-fast-path-generic-display.py
      - name: SAM-MIG V2.2 dialogue coordinator in model-fast-path, maintenance lock writer, S24 runs inventory
        run: python3 ../installer/termux-lite/test-model-fast-path-dialogue.py
      - name: Health manager never repairs the Companion during a deploy
        run: |
          python3 ../installer/termux-lite/test-runtime-mode.py
          python3 ../installer/termux-lite/test-health-deploy-lock.py
      - name: I5 bounded restart escalation, Tier0 rollback and notification dedupe
        run: python3 ../installer/termux-lite/test-health-restart-escalation.py
      - name: Runtime scripts resolve the Tier0 release root, never the working copy (R10/R12)
        run: python3 ../installer/termux-lite/test-no-hardcoded-clawmobile.py

      - name: R08/R09 portable Termux-lite tests and mandatory CI registration
        run: |
          bash ../installer/termux-lite/test-adb-recovery-readiness-watchdog.sh
          python3 ../installer/termux-lite/test-adb-recovery-readiness.py
          python3 ../installer/termux-lite/test-android-build-guard.py
          python3 ../installer/termux-lite/test-android-phantom-headroom.py
          python3 ../installer/termux-lite/test-android-i10.py
          python3 ../installer/termux-lite/test-capability-recovery.py
          python3 ../installer/termux-lite/test-ci-registration.py
          python3 ../installer/termux-lite/test-claw-live.py
          python3 ../installer/termux-lite/test-claw-slack-purge-setup.py
          node ../installer/termux-lite/test-claw-slack-purge.mjs
          python3 ../installer/termux-lite/test-context-coherence.py
          python3 ../installer/termux-lite/test-context-dream.py
          python3 ../installer/termux-lite/test-context-integration.py
          python3 ../installer/termux-lite/test-context-memory.py
          python3 ../installer/termux-lite/test-context-rule-installers.py
          python3 ../installer/termux-lite/test-engineering-runtime-bridge.py
          python3 ../installer/termux-lite/test-gateway-preflight.py
          node ../installer/termux-lite/test-gemini-live-client.mjs
          python3 ../installer/termux-lite/test-incident-continuation.py
          python3 ../installer/termux-lite/test-incident-correlation.py
          bash ../installer/termux-lite/test-incident-runtime-hardening.sh
          python3 ../installer/termux-lite/test-learning-gate.py
          python3 ../installer/termux-lite/test-native-recovery-entrypoint.py
          bash ../installer/termux-lite/test-openclaw-archive-copy.sh
          bash ../installer/termux-lite/test-openclaw-backup-publish.sh
          bash ../installer/termux-lite/test-plugin-install-noninteractive.sh
          python3 ../installer/termux-lite/test-rdc-incident-loop.py
          node ../installer/termux-lite/test-remote-desktop-health.mjs
          python3 ../installer/termux-lite/test-remote-desktop-watchdog.py
          node ../installer/termux-lite/test-slack-journal.mjs
          python3 ../installer/termux-lite/test-slack-runtime-contract.py
          python3 ../installer/termux-lite/test-supervisor-lock-portability.py
          python3 ../installer/termux-lite/test-tier0-control.py
          python3 ../installer/termux-lite/test-whatsapp-channel-health.py
          python3 ../installer/termux-lite/test-whatsapp-lock-recovery.py
          bash ../installer/termux-lite/test-whatsapp-owner-send.sh

      - name: Run immune I1/I2/I3/I8 contracts (deterministic recovery, handler gate, LKG hold, ingress root)
        run: |
          python3 ../installer/termux-lite/test-tier0-lkg-hold.py
          python3 ../installer/termux-lite/test-incident-orchestrator.py
          python3 ../installer/termux-lite/test-incident-deterministic-recovery.py
          python3 ../installer/termux-lite/test-incident-ingress.py
          python3 ../installer/termux-lite/test-companion-acceptance-settle.py
          python3 ../installer/termux-lite/test-companion-deploy-preflight.py
          python3 ../installer/termux-lite/test-runtime-sync.py
          python3 ../installer/termux-lite/test-companion-rollback-identity.py
          python3 ../installer/termux-lite/test-context-review-plan.py
      - name: Playbooks activation links ignored runtime dependencies
        run: bash ../installer/termux-lite/test-activate-ui-playbooks.sh
      - name: K2 owner access-change receipts without real sends
        run: python3 ../installer/termux-lite/test-k2-owner-message.py

      - name: Test health hysteresis with S24 correlated window
        run: python3 ../installer/termux-lite/test-health-hysteresis.py
      - name: Test canonical context event surfaces
        run: python3 ../installer/termux-lite/test-context-surfaces.py
      - name: Context ingest is idempotent across pending to processed race
        run: python3 ../installer/termux-lite/test-context-ingest-race.py
      - name: Test canonical app and authenticated Bixby bootstrap
        run: node scripts/test-canonical-agent-bootstrap.cjs
      - name: N4 request language transport
        run: node scripts/test-request-language-transport.cjs

      - name: Native OpenClaw provider fallback stays pinned to the free Gemini profile
        run: node scripts/test-native-provider-fallback.cjs

      - name: Parallel Free Web run contract, MCP identity and voice readback (offline)
        run: |
          node scripts/test-run-web.cjs
          node scripts/test-run-web-mcp.cjs
          node scripts/test-run-web-voice.cjs
          node scripts/test-run-web-agent.cjs
          python3 ../installer/termux-lite/test-model-fast-path-web.py

      - name: Run trace induction tests
        run: npm run test:trace-induction

      - name: Run Control health components contract
        run: node scripts/test-control-health-components.cjs

      - name: Run 38 M1 comprehension health field (real S24 runs capture)
        run: node scripts/test-control-comprehension.cjs

      - name: Run history deletion contract
        run: node scripts/test-delete-run.cjs

      - name: HS8 memo STT qualification receipt (S24 17/10), owner and transcript boundary
        run: node scripts/test-memo-stt-boundary.cjs && node scripts/test-memo-stt-owner.cjs && node scripts/test-memo-sdk-resolution.cjs && node scripts/test-memo-audio-duration.cjs
      - name: HS8 acceptance line for the composer microphone (catalog inputs.voiceMemo)
